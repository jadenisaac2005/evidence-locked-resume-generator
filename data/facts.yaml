      - {id: f1, text: "SMOTE + StandardScaler + XGBoost risk classifier trained on a 100,000-row synthetic slope-stability dataset"}
      - {id: f2, text: "FastAPI service mapping predicted probability to risk levels, with Twilio SMS alerts at the critical level; single-page React dashboard"}
      - {id: f3, text: "Re-evaluated the served model on a held-out test set (60/20/20 split): ROC-AUC 0.75; critical-level SMS alerts 98.3% precision, 17.4% recall"}
