  - id: fake-news
    name: Fake News Classifier
    dates: Mar 16, 2026
    ongoing: false
    links:
      - https://github.com/jadenisaac2005/news-headline-classifier
      - https://jadenisaac.com/projects/fake-news-classifier
    stack: [Python, scikit-learn, pandas, NLTK, NLP]
    facts:
      - {id: f1, text: "TF-IDF (unigrams + bigrams, 10,000 features) with logistic regression on the WELFake dataset (full articles, title + body)"}
      - {id: f2, text: "95.22% test accuracy after deduplication (80/20 split, seed 42)"}
      # Duplicate counts (reconciled from news-headline-classifier: notebook cell 4 prints
      # 72,134 -> 63,557 rows; README "Data Leakage" gives the group counts):
      #   16,528 = ALL rows that belong to a duplicate group (every copy, including the one kept),
      #            spread over 7,951 groups; duplicates = exact match on the cleaned title+text
      #            field (`clean_combined`), not on raw rows.
      #    8,577 = SURPLUS copies removed by drop_duplicates(keep="first"):
      #            16,528 - 7,951 = 8,577 = 72,134 - 63,557.
      #    2,656 = test rows (of 14,427) with an identical copy in train under the old split.
      - {id: f3, text: "Removed 8,577 exact duplicates (72,134 → 63,557 articles); under the original split, 2,656 test articles (18.4%) had an identical copy in training (leaky-split accuracy 95.76%)"}
      - {id: f4, text: "Baselines: title-only 88.91%; Multinomial Naive Bayes 86.27%"}
      - {id: f5, text: "Token ablation: removing 38 source/format tokens reduced accuracy to 93.54%; analysis showed the model relies mostly on outlet style (bylines, naming conventions), not claim content; the model's top-weighted features are mostly source/format artifacts (e.g. \"reuters\", \"image via\", weekday names)"}
      - {id: f6, text: "Found and fixed inverted label mapping in the original evaluation"}
    guards:
      - {number: "95.76", requires: "leaky"}
    bullets:
      - {id: model, supports: [f1, f2, f4], text: "Achieved 95.22% test accuracy on deduplicated WELFake articles (80/20 split, seed 42) with TF-IDF and logistic regression, vs 88.91% title-only and 86.27% Naive Bayes baselines"}
      - {id: dedup, supports: [f3], text: "Found 2,656 test articles (18.4%) with an identical copy in training (leaky-split accuracy 95.76%); deduplicating removed 8,577 surplus copies (72,134 → 63,557 articles)"}
      - {id: ablation, supports: [f5], text: "Showed the model's top-weighted features are mostly outlet style (bylines, naming conventions), not claim content; removing 38 such source/format tokens cut accuracy only to 93.54%"}
      - {id: labels, supports: [f6], text: "Corrected an inverted label mapping in the original evaluation"}

