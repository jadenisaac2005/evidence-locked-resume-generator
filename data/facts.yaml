      - {id: f7, text: "Test-set base rate of rockfall events: 64.75% (12,950 of 20,000 rows)"}
      - {id: f8, text: "API: FastAPI service mapping probability to GUARDED/ELEVATED/CRITICAL risk levels; Twilio SMS on CRITICAL"}
