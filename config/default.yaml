# Selects and orders content from data/facts.yaml. Never adds content.
max_pages: 1
paper: a4            # a4 (India/most countries) or us-letter
font_size: 11        # pt; research: 10–12
show_cgpa: true
contact: [location, phone, email, website, github, linkedin]   # x kept in facts, off here
ascii_output: true   # render → etc. as plain text in the PDF (facts.yaml keeps the originals)
sections: [education, projects, skills]
headings:
  education: Education
  projects: Projects
  skills: Skills
  experience: Experience
max_bullets_per_project: 3   # density target: 11–14 bullets on the page
projects:
  - {id: cpp-wasm, links: 1, bullets: [accuracy, weights, loader]}
  - {id: fake-news, links: 1, bullets: [model, dedup, ablation]}
  - {id: numpy-nn, links: 1, bullets: [convergence, momentum-bug]}
  - {id: rockfall, links: 1, bullets: [serve, eval, fixes]}
  # portfolio: not listed; jadenisaac.com stays in the contact line (see config/full.yaml)
skills: [languages, ml, systems_web, tools]
